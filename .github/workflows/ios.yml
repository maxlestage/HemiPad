name: Application iOS

on:
  push:
    branches: [master, main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# Droits minimaux : lire le code, rien d'autre. Chaque workflow déclare ce
# dont il a besoin plutôt que d'hériter des droits par défaut du dépôt.
permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# Ce travail est la raison pour laquelle le projet est développable sans
# ordinateur : c'est ici que le code Swift est réellement compilé et que les
# tests d'accessibilité tournent, sur un Mac fourni par GitHub.
jobs:
  build-et-tests:
    name: Compilation et tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # L'application lie une bibliothèque Rust : il faut la chaîne et les
      # cibles Apple avant de compiler. La version est figée par
      # bridge/rust-toolchain.toml.
      - name: Chaîne Rust pour iOS
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          source "$HOME/.cargo/env"
          cd bridge && rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          rustc --version

      - name: Xcode disponible
        run: xcodebuild -version

      - name: Choisir un simulateur iPhone
        id: simulateur
        run: |
          nom=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];n=[x['name'] for v in d.values() for x in v if x['name'].startswith('iPhone')];print(sorted(n)[-1] if n else '')")
          if [ -z "$nom" ]; then
            echo "aucun simulateur iPhone disponible" >&2
            exit 1
          fi
          echo "nom=$nom" >> "$GITHUB_OUTPUT"
          echo "simulateur retenu : $nom"

      - name: Compiler et tester
        run: |
          xcodebuild test \
            -project ios/HemiPad.xcodeproj \
            -scheme HemiPad \
            -destination "platform=iOS Simulator,name=${{ steps.simulateur.outputs.nom }}" \
            -resultBundlePath resultats.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Conserver le rapport de tests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resultats-xcode
          path: resultats.xcresult
          if-no-files-found: ignore
