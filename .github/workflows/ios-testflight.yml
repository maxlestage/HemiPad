name: Livraison TestFlight

# Compile HemiPad, la signe, et l'envoie sur TestFlight — sans ordinateur.
#
# Tout ce qui demande habituellement un Mac est fait ici par le Mac de GitHub :
# la compilation, la signature, la création du certificat et du profil de
# provisionnement. Ce qui reste à faire depuis le téléphone tient dans un
# navigateur : créer une clé d'API, la coller dans les secrets du dépôt, et
# appuyer sur « Run workflow ».
#
# Trois secrets sont nécessaires, décrits dans
# docs/build-ios-depuis-le-telephone.md :
#
#   APPLE_API_KEY_ID      identifiant de la clé (10 caractères)
#   APPLE_API_ISSUER_ID   identifiant de l'émetteur (un UUID)
#   APPLE_API_KEY_P8      contenu du fichier .p8, collé tel quel
#   APPLE_TEAM_ID         identifiant de l'équipe (10 caractères)
#
# Le numéro de build vaut le numéro d'exécution du workflow : il ne recule
# jamais, et TestFlight refuse deux envois portant le même numéro.

on:
  workflow_dispatch:
    inputs:
      envoyer:
        description: 'Envoyer sur TestFlight (sinon, on compile et on signe sans envoyer)'
        required: false
        default: true
        type: boolean
      version:
        description: 'Version affichée (vide = celle du projet)'
        required: false
        type: string
  push:
    tags: ['v*']

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  livrer:
    name: Archiver et livrer
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que les secrets sont en place
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          manquants=""
          [ -n "$KEY_ID" ]    || manquants="$manquants APPLE_API_KEY_ID"
          [ -n "$ISSUER_ID" ] || manquants="$manquants APPLE_API_ISSUER_ID"
          [ -n "$KEY_P8" ]    || manquants="$manquants APPLE_API_KEY_P8"
          [ -n "$TEAM_ID" ]   || manquants="$manquants APPLE_TEAM_ID"
          if [ -n "$manquants" ]; then
            echo "::error::Secrets manquants :$manquants — voir docs/build-ios-depuis-le-telephone.md"
            exit 1
          fi
          echo "les quatre secrets sont présents"

      - name: Installer la clé d'API
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # xcodebuild lit la clé à un chemin donné ; altool la cherche seul
          # dans ~/.appstoreconnect/private_keys. On la dépose aux deux endroits.
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          # Un .p8 mal collé (guillemets, retours à la ligne perdus) donne une
          # erreur d'authentification illisible dix minutes plus tard.
          head -1 ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
            | grep -q 'BEGIN PRIVATE KEY' \
            || { echo "::error::APPLE_API_KEY_P8 ne ressemble pas à une clé .p8 (première ligne attendue : -----BEGIN PRIVATE KEY-----)"; exit 1; }

      - name: Le projet Xcode est à jour
        run: python3 ios/tools/generate_pbxproj.py --check

      - name: Archiver
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          reglages=(
            "DEVELOPMENT_TEAM=$TEAM_ID"
            "CODE_SIGN_STYLE=Automatic"
            "CURRENT_PROJECT_VERSION=${{ github.run_number }}"
          )
          if [ -n "$VERSION" ]; then
            reglages+=("MARKETING_VERSION=$VERSION")
          fi

          # -allowProvisioningUpdates autorise xcodebuild à créer lui-même
          # l'identifiant d'application, le certificat et le profil manquants,
          # en s'authentifiant avec la clé d'API. C'est ce qui rend la chaîne
          # utilisable sans jamais ouvrir Xcode.
          xcodebuild archive \
            -project ios/HemiPad.xcodeproj \
            -scheme HemiPad \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HemiPad.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            "${reglages[@]}"

      - name: Exporter l'IPA
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Xcode 15.3 a renommé « app-store » en « app-store-connect ».
          # L'ancien nom reste accepté, le nouveau ne l'est pas partout : on
          # essaie le nouveau, puis l'ancien, plutôt que de parier sur la
          # version d'Xcode installée sur l'image du jour.
          for methode in app-store-connect app-store; do
            cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$methode</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
            echo "tentative d'export avec method=$methode"
            if xcodebuild -exportArchive \
                -archivePath build/HemiPad.xcarchive \
                -exportPath build/ipa \
                -exportOptionsPlist build/ExportOptions.plist \
                -allowProvisioningUpdates \
                -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
                -authenticationKeyID "$KEY_ID" \
                -authenticationKeyIssuerID "$ISSUER_ID"; then
              echo "export réussi (method=$methode)"
              break
            fi
            echo "::warning::export refusé avec method=$methode"
          done
          ls -lh build/ipa || true
          test -n "$(find build/ipa -name '*.ipa' -print -quit 2>/dev/null)" \
            || { echo "::error::aucun IPA produit"; exit 1; }

      - name: Envoyer sur TestFlight
        if: github.event_name == 'push' || inputs.envoyer
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          ipa=$(find build/ipa -name '*.ipa' | head -1)
          echo "envoi de $ipa"
          # La validation d'abord : elle échoue en trente secondes là où un
          # envoi refusé se découvre par courriel, une heure plus tard.
          xcrun altool --validate-app -f "$ipa" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "::notice::Build ${{ github.run_number }} envoyé. Il apparaît dans TestFlight après le traitement par Apple (5 à 30 minutes)."

      - name: Conserver l'IPA et les symboles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hemipad-ipa-${{ github.run_number }}
          path: |
            build/ipa/*.ipa
            build/ipa/*.plist
          if-no-files-found: warn
          retention-days: 30
