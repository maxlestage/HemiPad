[package]
name = "hemipad-site"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false
description = "Le site vitrine de HemiPad, écrit en Rust (Yew) et compilé en WebAssembly."

[[bin]]
name = "hemipad-site"
path = "src/main.rs"

[dependencies]
yew = { version = "0.23", features = ["csr"] }
# Version exacte : l'outil wasm-bindgen qui produit le paquet doit être le même,
# au correctif près. web/tools/construire.mjs télécharge celui-là.
wasm-bindgen = "=0.2.129"
js-sys = "0.3.106"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-timers = "0.3"
wasm-bindgen-futures = "0.4.79"

[dependencies.web-sys]
version = "0.3.106"
features = [
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "CanvasWindingRule",
  "Clipboard",
  "CssStyleDeclaration",
  "DeviceOrientationEvent",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlMetaElement",
  "ImageData",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MediaQueryListEvent",
  "MouseEvent",
  "Navigator",
  "Node",
  "NodeList",
  "Path2d",
  "Performance",
  "PointerEvent",
  "Screen",
  "ScrollBehavior",
  "ScrollToOptions",
  "ServiceWorkerContainer",
  "ShareData",
  "Storage",
  "SvgElement",
  "SvgGraphicsElement",
  "SvgsvgElement",
  "TextMetrics",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlContextAttributes",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "WheelEvent",
  "Window",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
