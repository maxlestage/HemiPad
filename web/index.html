<!doctype html>
<html lang="fr" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060d" />
    <meta name="color-scheme" content="dark light" />
    <title>HemiPad · la manette qui s'adapte à votre main</title>
    <meta
      name="description"
      content="HemiPad transforme un iPhone en manette de jeu et en clavier de code utilisables d'une seule main. Conçue avec et pour les personnes hémiplégiques."
    />
    <meta name="author" content="Maxime Nathan Lestage" />
    <meta name="robots" content="index, follow" />

    <!-- Fiche de partage : ce que voient les messageries et les réseaux -->
    <meta property="og:site_name" content="HemiPad" />
    <meta property="og:title" content="HemiPad · la manette qui s'adapte à votre main" />
    <meta
      property="og:description"
      content="Un iPhone ou un iPad devient une manette Bluetooth, sans rien acheter, et un clavier de code pour l'ordinateur. Pensée pour une seule main valide."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:image" content="/partage.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="HemiPad : la manette tactile qui s'adapte à une seule main."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HemiPad · la manette qui s'adapte à votre main" />
    <meta
      name="twitter:description"
      content="Un iPhone ou un iPad devient une manette Bluetooth, sans rien acheter, et un clavier de code pour l'ordinateur. Pensée pour une seule main valide."
    />
    <meta name="twitter:image" content="/partage.png" />

    <!-- Application installable -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Onglet : la variante 16 px d'abord, le pointillé n'y tient pas -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HemiPad" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Thème et langue appliqués avant le premier rendu. Fichier séparé, et
         non script en ligne : la politique de sécurité (CSP) n'autorise que
         les scripts servis par le site. -->
    <script src="/theme-init.js"></script>
    <!-- Remplis par web/tools/construire.mjs : la feuille de style, le
         programme WebAssembly et son chargeur, sous des noms qui changent à
         chaque version. -->
    {{PRECHARGES}}
    <link rel="stylesheet" href="{{STYLE}}" />
    <script type="module" src="{{DEMARRAGE}}"></script>
  </head>
  <body>
    <!--
      La porte : le signe HemiPad se trace pendant que le programme se charge,
      et le compte monte jusqu'à cent. Rien de tout cela ne demande de script :
      le tracé et le compte sont en CSS. Le programme ouvre la porte quand il
      est prêt ; s'il ne l'est jamais, elle s'ouvre seule au bout de quelques
      secondes, pour ne jamais retenir la page.
    -->
    <div class="porte" aria-hidden="true">
      <svg class="porte-signe" viewBox="0 0 64 64">
        <path class="trace trace-plein" pathLength="1" d="M32 20H20c-7 0-11 4-12.5 11L5.5 41c-1 5.5 2.5 9 6.5 9 3.5 0 6-2.5 8-5.5L22.5 41H32Z" />
        <path class="trace trace-croix" pathLength="1" d="M17.2 27.8h3.6v3.8h3.8v3.6h-3.8v3.8h-3.6v-3.8h-3.8v-3.6h3.8Z" />
        <path class="trace trace-moitie" pathLength="1" d="M32 20h12c7 0 11 4 12.5 11L58.5 41c1 5.5-2.5 9-6.5 9-3.5 0-6-2.5-8-5.5L41.5 41H32Z" />
        <circle class="porte-point" cx="44.5" cy="29.5" r="3.4" />
        <circle class="porte-point porte-point-2" cx="50.5" cy="35.5" r="3.4" />
      </svg>
      <p class="porte-compte"><span class="porte-nombre"></span></p>
    </div>

    <div id="racine"></div>

    <noscript>
      <p class="sans-script">
        HemiPad transforme un iPhone ou un iPad en manette utilisable d'une
        seule main. Ce site est un programme WebAssembly : activez JavaScript
        pour le voir.
      </p>
    </noscript>
  </body>
</html>
